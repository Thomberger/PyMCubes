name: build-cp313-wheels
on: [workflow_dispatch]

jobs:
  wheels:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-13, macos-14]
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        uses: pypa/cibuildwheel@v3.0.0
        env:
          CIBW_BUILD: "cp313-*"
          CIBW_SKIP: "*-musllinux*"          # drop if you want musl too
          CIBW_ARCHS_MACOS: "auto"           # macos-13 -> x86_64, macos-14 -> arm64
          CIBW_ARCHS_LINUX: "x86_64"         # add "aarch64" only if you need ARM Linux
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl